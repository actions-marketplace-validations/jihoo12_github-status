name: Update GitHub stats

on:
  schedule:
    - cron: "17 0 * * *" # daily, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "flake.*"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Test
        run: nix develop -c npm test

      - name: Generate SVGs
        run: nix develop -c node src/index.js
        env:
          # Optional GH_STATS_TOKEN secret (a personal access token) also counts
          # private contributions; the default token only sees public data.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}

      - name: Commit changes
        run: |
          git add generated
          if git diff --cached --quiet; then
            echo "Stats unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitHub stats"
          git push
