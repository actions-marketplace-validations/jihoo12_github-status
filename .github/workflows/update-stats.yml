name: Update GitHub stats

on:
  schedule:
    - cron: "17 0 * * *" # daily, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "flake.*"
      - "action.yml"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Test
        run: nix develop -c npm test

      # Dogfood the action itself; it commits generated/ when the stats changed.
      - name: Generate SVGs
        uses: ./
        with:
          # Optional GH_STATS_TOKEN secret (a personal access token) also counts
          # private contributions; the default token only sees public data.
          token: ${{ secrets.GH_STATS_TOKEN || github.token }}
